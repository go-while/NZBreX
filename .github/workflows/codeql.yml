name: CodeQL

# Code scanning for the Go code, rapidyenc's C code (the submodule, built for
# the -tags rapidyenc variant) and the workflow files. Results go to the
# repository's Security tab. Runs when main changes, once a week (new queries
# find new things in old code), and by hand.

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 5 * * 1" # Mondays 05:30 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # upload the results
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
            queries: security-extended,security-and-quality
          - language: c-cpp
            build-mode: manual
            queries: security-extended
          - language: actions
            build-mode: none
            queries: security-extended
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: ${{ matrix.language == 'c-cpp' }}
      - uses: actions/setup-go@v7
        if: matrix.language == 'go'
        with:
          go-version-file: go.mod
      - name: Install build tools
        if: matrix.language == 'c-cpp'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: ${{ matrix.queries }}
      - uses: github/codeql-action/autobuild@v4
        if: matrix.build-mode == 'autobuild'
      - name: Build the rapidyenc library
        if: matrix.language == 'c-cpp'
        run: cd rapidyenc && ./build_rapidyenc_linux-amd64.sh
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
