name: "CodeQL Advanced"

on:
  push:
    branches: [ "main", "testing" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '16 06 * * 1'

jobs:
  analyze:
    name: Analyze (${{ matrix.runner_name }}-${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
            runner: [self-hosted, ubu2204-gor]
            runner_name: "SHR-ubu2204-gor"
          - language: go
            build-mode: autobuild
            runner: ubuntu-latest
            runner_name: "GH-ubuntu-latest"
          - language: c-cpp
            build-mode: manual
            runner: [self-hosted, ubu2204-gor]
            runner_name: "SHR-ubu2204-gor"
          - language: c-cpp
            build-mode: manual
            runner: ubuntu-latest
            runner_name: "GH-ubuntu-latest"
          - language: actions
            build-mode: none
            runner: ubuntu-latest
            runner_name: "GH-ubuntu-latest"

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        queries: security-extended,security-and-quality
        ram: 1 # Optional, specify in GB

    - name: Build (manual, for C/C++)
      if: matrix.language == 'c-cpp'
      # Run the build step only for C/C++ jobs
      run: |
        cd rapidyenc
        ./clone_rapidyenc.sh
        ./build_rapidyenc_linux-amd64.sh

    - name: Perform CodeQL Analysis
      if: matrix.language != 'actions'
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"
