name: "CodeQL Advanced"

on:
  push:
    branches: [ "main", "testing" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '16 06 * * 1'

jobs:
  analyze:
    name: Analyze (${{ matrix.runner_name }}-${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          # run codeQL on SHR: Go
          - language: go
            build-mode: autobuild
            runner: [self-hosted, ubu2204-gor]
            runner_name: "runner-ubu2204-gor"

          # run codeQL on SHR: Go
          - language: go
            build-mode: autobuild
            runner: [self-hosted, ubu2404-gor]
            runner_name: "runner-ubu2404-gor"

          # run codeQL on SHR: C/C++
          - language: c-cpp
            build-mode: manual
            runner: [self-hosted, ubu2204-gor]
            runner_name: "runner-ubu2204-gor"

          # run codeQL on SHR: C/C++
          - language: c-cpp
            build-mode: manual
            runner: [self-hosted, ubu2404-gor]
            runner_name: "runner-ubu2404-gor"

          # run codeQL on SHR: Actions
          - language: actions
            build-mode: none
            runner: [self-hosted, ubu2204-gor]
            runner_name: "runner-ubu2204-gor"

          # run codeQL on SHR: Actions
          - language: actions
            build-mode: none
            runner: [self-hosted, ubu2404-gor]
            runner_name: "runner-ubu2404-gor"

          # run codeQL on GH: Actions
          - language: actions
            build-mode: none
            runner: ubuntu-latest
            runner_name: "GH-ubuntu-latest"

          # run codeQL on GH: Go
          - language: go
            build-mode: autobuild
            runner: ubuntu-latest
            runner_name: "GH-ubuntu-latest"

          # run codeQL on GH: C/C++
          - language: c-cpp
            build-mode: manual
            runner: ubuntu-latest
            runner_name: "GH-ubuntu-latest"


    steps:
    - name: Set up Go
      if: matrix.language == 'go' && matrix.build-mode == 'autobuild'
      uses: actions/setup-go@v5
      with:
        go-version: '1.24.3' # or whatever version you need
        cache: false

    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        queries: security-extended,security-and-quality
        ram: 8 # Optional, specify in GB

    - name: Autobuild
      if: matrix.language == 'go' && matrix.build-mode == 'autobuild'
      # Run the autobuild step only for Go jobs
      uses: github/codeql-action/autobuild@v3

    - name: Build (manual, for C/C++)
      if: matrix.language == 'c-cpp' && matrix.build-mode != 'autobuild'
      # Run the build step only for C/C++ jobs
      run: |
        cd rapidyenc
        if [ ! -e rapidyenc ]; then
          ./clone_rapidyenc.sh
          if [ ! -e rapidyenc/.git ]; then
            echo "rapidyenc/ src not found, exiting"
            exit 1
          fi
        else
          echo "rapidyenc/ src exists, skipping clone"
        fi
        ./build_rapidyenc_linux-amd64.sh

    - name: Perform CodeQL Analysis
      #if: matrix.language != 'actions'
      uses: github/codeql-action/analyze@v3
