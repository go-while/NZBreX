      #    DIST="dist.${{ env.VERSION }}-${{ env.SHA7 }}-${{ matrix.name }}${{ env.LIBC }}.$(hostname).tar.gz"
      #    if [ -e "$DIST" ]; then
      #      echo "$DIST already exists. Skipping tar."
