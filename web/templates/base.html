<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}} - NZBreX</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    {{block "extra_head" .}}{{end}}
</head>
<body class="bg-light">
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="/">
                <span class="fs-4">🔄</span> NZBreX
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link {{if eq .ActivePage "home"}}active{{end}}" href="/">
                            📁 Upload
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {{if eq .ActivePage "jobs"}}active{{end}}" href="/jobs">
                            📋 Jobs
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {{if eq .ActivePage "stats"}}active{{end}}" href="/stats">
                            📊 Statistics
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container my-4">
        {{block "content" .}}{{end}}
    </div>

    <!-- Toast Container for Notifications -->
    <div class="toast-container position-fixed top-0 end-0 p-3"></div>

    <!-- Footer -->
    <footer class="text-center text-muted py-3 mt-5">
        <small>NZBreX - NZB Refresh X | Usenet Article Restoration Tool</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {{block "extra_scripts" .}}{{end}}
</body>
</html>
